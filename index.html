<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="description" content="ALIF Traun: Linz için güncel namaz vakitleri. Büyük ve okunaklı namaz saatleri, canlı saat ve sonraki namaza kalan süre.">
  <title>ALIF Traun · Namaz Vakitleri</title>
  <link rel="icon" type="image/jpeg" href="Alif%20Traun%20Logo%20-%20LOGO%20Alif%20Traun%20Subesi.jpg">
  <link rel="stylesheet" href="styles.css?v=portrait-2">
  <script src="prayer-core.js" defer></script>
  <script src="app.js?v=portrait-2" defer></script>
</head>
<body>
  <a class="skip-link" href="#prayer-times">Namaz vakitlerine geç</a>
  <div class="display-shell">
    <header class="masthead">
      <div class="identity-row">
        <img class="brand-logo" src="Alif%20Traun%20Logo%20-%20LOGO%20Alif%20Traun%20Subesi.jpg" alt="Ortsverein Traun · ALIF" width="500" height="100">
        <h1>Namaz Vakitleri</h1>
      </div>
      <div class="date-row">
        <p class="date"><span class="location">Linz</span><span class="date-divider" aria-hidden="true">·</span><span id="miladi">Tarih yükleniyor…</span></p>
        <div class="clock-block"><span class="clock-label">Saat</span><time id="clock"><span id="clock-main">--:--</span><span id="clock-seconds" class="seconds">:--</span></time></div>
      </div>
    </header>
    <main id="prayer-times" class="prayer-section" aria-label="Bugünün altı vakti">
      <div class="times-grid" id="times" aria-busy="true"></div>
    </main>
    <section class="next-panel" aria-label="Sonraki namaz">
      <div class="next-copy"><p class="next-label">Sonraki namaz</p><h2 id="next-name">Vakitler bekleniyor</h2><p id="next-detail">Linz vakitleri yükleniyor…</p></div>
      <div class="countdown-block"><span class="countdown-label">Kalan süre</span><time id="countdown" role="timer" aria-label="Sonraki namaza kalan süre"><span id="countdown-main">--:--</span><span id="countdown-seconds" class="seconds">:--</span></time></div>
    </section>
    <footer class="display-footer">
      <p id="display-status" role="status">Vakitler yükleniyor…</p>
      <nav class="controls" aria-label="Ekran seçenekleri">
        <button id="calendar-toggle" type="button" aria-haspopup="dialog" aria-controls="calendar-panel">Takvim</button>
        <button id="fullscreen-toggle" type="button" aria-pressed="false">Tam ekran</button>
      </nav>
    </footer>
  </div>
  <dialog id="calendar-panel" aria-labelledby="calendar-title">
    <div class="dialog-header"><h2 id="calendar-title">Namaz takvimi</h2><button id="calendar-close" type="button" aria-label="Takvimi kapat">Kapat</button></div>
    <p id="hicri"></p><p id="calendar-range"></p>
    <div class="table-scroll" tabindex="0" role="region" aria-label="Linz namaz takvimi"><table><caption class="sr-only">Linz için kaynaktaki namaz vakitleri</caption><thead><tr><th scope="col">Tarih</th><th scope="col">İmsak</th><th scope="col">Güneş</th><th scope="col">Öğle</th><th scope="col">İkindi</th><th scope="col">Akşam</th><th scope="col">Yatsı</th></tr></thead><tbody id="calendar-body"></tbody></table></div>
    <p id="data-status" role="status"></p>
    <div class="dialog-footer"><a href="https://namazvakitleri.com.tr/sehir/1480/linz-namaz-vakitleri" target="_blank" rel="noopener noreferrer">Kaynak: Linz · Diyanet</a><button id="refresh-button" type="button">Yenile</button></div>
  </dialog>
  <noscript><p class="noscript-notice">Namaz vakitleri için JavaScript gerekli. <a href="https://namazvakitleri.com.tr/sehir/1480/linz-namaz-vakitleri">Kaynağı aç</a></p></noscript>
</body>
</html>
